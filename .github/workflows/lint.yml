name: Lint

on:
  push:
    branches:
      - main
      - 'portfolio/**'
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n scripts/postgresql-backup.sh
          bash -n scripts/postgresql-restore.sh

      - name: ShellCheck
        run: |
          shellcheck scripts/postgresql-backup.sh
          shellcheck scripts/postgresql-restore.sh
